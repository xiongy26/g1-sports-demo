<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unitree G1 · MuJoCo WASM 运动演示（篮球 / 乒乓球 / 双机对打）</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
    #app { position: fixed; inset: 0; }

    .panel {
      position: fixed; z-index: 10;
      background: rgba(16, 20, 28, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      color: #e8ecf4;
    }

    #topbar { top: 16px; left: 16px; padding: 14px 18px; max-width: 340px; }
    #topbar h1 { font-size: 16px; font-weight: 650; letter-spacing: 0.02em; }
    #topbar h1 em { font-style: normal; color: #6fb2ff; }
    #hint { margin-top: 6px; font-size: 12.5px; line-height: 1.55; color: #a8b3c4; }

    #controls { top: 16px; right: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; gap: 8px; }
    button {
      font: inherit; font-size: 13px; cursor: pointer;
      color: #dfe6f2; background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9px; padding: 8px 14px;
      transition: background 0.15s, transform 0.05s;
    }
    button:hover { background: rgba(255, 255, 255, 0.14); }
    button:active { transform: scale(0.97); }
    button.active { background: #2f6fed; border-color: #2f6fed; color: #fff; }
    select {
      font: inherit; font-size: 13px; color: #dfe6f2;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9px; padding: 8px 6px;
    }

    #hud {
      bottom: 16px; left: 16px; padding: 10px 16px;
      display: flex; gap: 18px; align-items: center;
      font-size: 13px; color: #a8b3c4;
    }
    #hud b { color: #fff; font-size: 20px; font-variant-numeric: tabular-nums; }
    #hud .label { font-size: 11px; color: #77839a; display: block; }

    #toast {
      position: fixed; z-index: 20; left: 50%; top: 18%;
      transform: translateX(-50%) scale(0.9);
      padding: 10px 26px; border-radius: 999px;
      background: rgba(24, 40, 80, 0.85); color: #fff;
      font-size: 18px; font-weight: 600;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

    #loading {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; gap: 18px;
      align-items: center; justify-content: center;
      background: #0d1119; color: #cfd8e6;
      transition: opacity 0.5s; 
    }
    #loading.done { opacity: 0; pointer-events: none; }
    .spinner {
      width: 42px; height: 42px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.12); border-top-color: #2f6fed;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-bar-wrap { width: 280px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
    #loading-bar { height: 100%; width: 0%; background: #2f6fed; transition: width 0.2s; }
    #loading-text { font-size: 14px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="topbar" class="panel">
    <h1>Unitree G1 · <em>MuJoCo WASM</em> 运动演示</h1>
    <div id="hint">G1 原地运球，周期性投篮（弹道由 WASM 物理仿真）</div>
  </div>

  <div id="controls" class="panel">
    <div class="row">
      <button id="mode-basketball" class="active">🏀 篮球</button>
      <button id="mode-pingpong">🏓 乒乓球</button>
    </div>
    <div class="row">
      <button id="mode-duel">🏓🏓 双机对打</button>
    </div>
    <div class="row">
      <button id="action-btn">投篮 🏀</button>
      <button id="pause-btn">暂停</button>
    </div>
    <div class="row">
      <select id="speed-sel" title="仿真速度">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1.0×</option>
        <option value="1.5">1.5×</option>
      </select>
    </div>
  </div>

  <div id="hud" class="panel">
    <div><span class="label">进球 / 回合</span><b id="score">0</b></div>
    <div><span class="label">状态</span><b id="fps" style="font-size:13px">—</b></div>
  </div>

  <div id="toast"></div>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">初始化…</div>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
